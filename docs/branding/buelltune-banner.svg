<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1115"/>
      <stop offset="100%" stop-color="#181B22"/>
    </linearGradient>

    <!-- Primary Flame Gradient (Buell Racing Orange) -->
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF2A00"/>
    </linearGradient>

    <!-- Telemetry Cyan Gradient -->
    <linearGradient id="cyan-grad" gradientUnits="userSpaceOnUse" x1="20" y1="175" x2="210" y2="175">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Glow Filter for Telemetry Accents -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Wing Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F5F7"/>
      <stop offset="50%" stop-color="#9AA0A6"/>
      <stop offset="100%" stop-color="#4A505A"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="240" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Pattern Lines (ECU Mapping / Telemetry Theme) -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>

  <!-- ICON: THE DIGITAL WING (Pegasus Head + Equalizer Feathers) -->
  <g id="logo-mark" transform="translate(45, 30)">
    <!-- Base Pegasus Neck / Crest (Precision Angle Shears) -->
    <path d="M 30,175 L 60,115 L 105,115 L 75,175 Z" fill="#2A2E37"/>
    <path d="M 68,110 L 98,50 L 143,50 L 113,110 Z" fill="url(#metal-grad)"/>

    <!-- Wing Feather 1: Low-Range Power / Base (Equalizer Bar 1) -->
    <path d="M 82,175 L 112,115 L 132,115 L 102,175 Z" fill="url(#flame-grad)"/>
    
    <!-- Wing Feather 2: Mid-Range Power / Acceleration (Equalizer Bar 2) -->
    <path d="M 109,175 L 149,95 L 169,95 L 129,175 Z" fill="url(#flame-grad)"/>

    <!-- Wing Feather 3: Peak RPM / High-End Data Surge (Equalizer Bar 3) -->
    <path d="M 136,175 L 186,75 L 206,75 L 156,175 Z" fill="url(#flame-grad)"/>

    <!-- Wing Feather 4: Apex Wingtip (Max Lift) -->
    <path d="M 163,175 L 223,55 L 243,55 L 183,175 Z" fill="#FF7733"/>

    <!-- Digital Node Circuit Overlay (Software/ECU Tuning Link) -->
    <g filter="url(#cyan-glow)">
      <!-- Horizon Data Signal Line -->
      <path d="M 20,175 L 210,175" stroke="url(#cyan-grad)" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Telemetry Nodes -->
      <circle cx="60" cy="175" r="4" fill="#00E5FF"/>
      <circle cx="105" cy="115" r="3" fill="#00E5FF"/>
      <circle cx="143" cy="50" r="3.5" fill="#00E5FF"/>
      <circle cx="223" cy="55" r="4" fill="#00E5FF"/>
      
      <!-- Connection Vectors -->
      <line x1="60" y1="175" x2="105" y2="115" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="105" y1="115" x2="143" y2="50" stroke="#00E5FF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- TYPOGRAPHY: BUELLTUNE -->
  <g id="logo-text" transform="translate(310, 138)">
    <!-- "BUELL" - Heavy, Aggressive, Engineered Hardware -->
    <text x="0" y="0" 
          font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Chakra Petch', sans-serif" 
          font-weight="900" 
          font-size="64" 
          letter-spacing="2" 
          fill="#F4F5F7"
          font-style="italic">BUELL</text>
    
    <!-- "TUNE" - High-Tech, Precision Software Overlay -->
    <text x="232" y="0" 
          font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Chakra Petch', sans-serif" 
          font-weight="300" 
          font-size="64" 
          letter-spacing="4" 
          fill="url(#cyan-grad)"
          font-style="italic"
          filter="url(#cyan-glow)">TUNE</text>

    <!-- Sub-Brand Tagline / Technical Specs -->
    <text x="5" y="32" 
          font-family="'JetBrains Mono', 'Fira Code', monospace" 
          font-weight="500" 
          font-size="13" 
          letter-spacing="6" 
          fill="#9AA0A6">ECU DIAGNOSTICS &amp; CALIBRATION</text>
  </g>
</svg>
